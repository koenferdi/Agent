<title>Validatiedesk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-css">
:root{
  --night:#0B1220; --night-2:#111A2C; --panel:#151F35; --panel-2:#1C2942;
  --line:#27354F; --line-2:#38496B;
  --ink:#E8EDF7; --ink-soft:#9BA9C4; --ink-faint:#6B7A99;
  --gold:#F5C542; --teal:#4FD1C5; --amber:#F0A860; --violet:#A78BFA; --slate:#6B7A99;
  --ok:#5FCE9B; --wait:#F0B454; --busy:#6BA8F5; --idle:#5A6982;
}
:root[data-theme="light"]{
  --night:#DDE4F0; --night-2:#E7ECF6; --panel:#FFFFFF; --panel-2:#F1F4FA;
  --line:#C6D0E2; --line-2:#A9B7D0;
  --ink:#141C2E; --ink-soft:#4C5A76; --ink-faint:#6F7D99;
  --ok:#1F8A5C; --wait:#9A6A12; --busy:#2C63B8; --idle:#7A87A0;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --night:#DDE4F0; --night-2:#E7ECF6; --panel:#FFFFFF; --panel-2:#F1F4FA;
    --line:#C6D0E2; --line-2:#A9B7D0;
    --ink:#141C2E; --ink-soft:#4C5A76; --ink-faint:#6F7D99;
    --ok:#1F8A5C; --wait:#9A6A12; --busy:#2C63B8; --idle:#7A87A0;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 64px}
.pix{font-family:"Press Start 2P",ui-monospace,monospace;line-height:1.6;letter-spacing:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* header */
.hdr{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.hdr h1{margin:0;font-size:17px}
.hdr .sub{color:var(--ink-soft);font-size:13.5px;margin-top:8px;max-width:62ch}
.savepill{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em;color:var(--ink-faint);
  border:1px solid var(--line-2);background:var(--panel);padding:6px 11px;border-radius:3px;white-space:nowrap}
.savepill[data-tone="warn"]{color:var(--wait);border-color:var(--wait)}
.savepill[data-tone="ok"]{color:var(--ok);border-color:var(--ok)}

/* map */
.mapbox{position:relative;border:2px solid var(--line-2);border-radius:4px;overflow:hidden;background:#0d1a14;
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 16px 40px -24px rgba(0,0,0,.9)}
#map{display:block;width:100%;height:auto;image-rendering:pixelated}
.tag{position:absolute;transform:translate(-50%,-100%);background:rgba(10,16,28,.92);
  border:1px solid var(--line-2);border-left:3px solid var(--slate);padding:5px 8px 6px;border-radius:2px;
  cursor:pointer;white-space:nowrap;backdrop-filter:blur(2px);text-align:left}
.tag:hover,.tag:focus-visible{border-color:var(--gold);outline:none}
.tag[data-sel="1"]{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,197,66,.28)}
.tag .no{font-family:"Press Start 2P",monospace;font-size:7px;color:var(--ink-faint);letter-spacing:.06em}
.tag .nm{font-family:"Press Start 2P",monospace;font-size:8px;color:#EEF3FF;margin-top:3px;display:block}
.tag .st{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:10px;color:var(--ink-soft);
  font-family:"IBM Plex Mono",monospace;letter-spacing:.03em}
.tag .dot{width:6px;height:6px;border-radius:50%;background:var(--idle);flex:none}
@media (max-width:720px){
  .tag{padding:3px 5px 4px}
  .tag .no{font-size:5px} .tag .nm{font-size:6px} .tag .st{font-size:8px}
}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:9px 12px;background:var(--night-2);
  border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint)}
.maplegend span{display:flex;align-items:center;gap:6px}
.maplegend i{width:7px;height:7px;border-radius:50%;display:block}

/* panels */
.cols{display:grid;grid-template-columns:1fr;gap:20px;margin-top:22px}
@media (min-width:920px){.cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px}
.panel>h2{margin:0;padding:12px 16px;font-size:10px;border-bottom:1px solid var(--line);
  font-family:"Press Start 2P",monospace;color:var(--ink);letter-spacing:.02em}
.panel .body{padding:16px}
.hint{color:var(--ink-soft);font-size:13.5px}
.empty{border:1px dashed var(--line-2);border-radius:3px;padding:16px;color:var(--ink-soft);font-size:13.5px;background:var(--panel-2)}
.empty b{color:var(--ink)}

/* agent head */
.ahead{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.badge{width:34px;height:34px;border-radius:3px;flex:none;border:1px solid var(--line-2);display:grid;place-items:center;
  font-family:"Press Start 2P",monospace;font-size:9px;color:#0B1220}
.ahead .nm{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500}
.ahead .rl{font-size:13px;color:var(--ink-soft);margin-top:3px;max-width:52ch}

/* briefs */
.stack{display:flex;flex-direction:column;gap:10px}
.brief{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.brief h3{margin:0;font-size:15px;line-height:1.35}
.brief .meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12.5px;color:var(--ink-soft)}
.brief .meta b{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-faint);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:2px;border:1px solid currentColor}
.chip[data-s="nieuw"]{color:var(--wait)} .chip[data-s="opgepakt"]{color:var(--busy)}
.chip[data-s="geleverd"]{color:var(--ok)} .chip[data-s="geparkeerd"]{color:var(--idle)}
.chip[data-c="hoog"]{color:var(--ok)} .chip[data-c="midden"]{color:var(--wait)} .chip[data-c="laag"]{color:var(--idle)}
.findings{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.finding{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.finding p{margin:0}
.finding .src{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);margin-top:2px;word-break:break-all}
.tools{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:11px}

/* decisions */
.dec{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--wait);border-radius:3px;padding:12px 14px}
.dec h3{margin:0;font-size:14.5px;line-height:1.35}
.dec p{margin:7px 0 0;font-size:13px;color:var(--ink-soft)}

/* forms */
label{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:var(--night-2);
  border:1px solid var(--line-2);border-radius:3px;padding:7px 9px}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit;font-size:13px;font-weight:500;cursor:pointer;background:var(--panel-2);color:var(--ink);
  border:1px solid var(--line-2);border-radius:3px;padding:6px 12px}
button:hover{border-color:var(--gold);color:var(--gold)}
button.primary{background:var(--gold);border-color:var(--gold);color:#141C2E}
button.primary:hover{filter:brightness(1.08);color:#141C2E}
button.quiet{background:transparent;border-color:transparent;color:var(--ink-faint);padding:6px 7px}
button.quiet:hover{color:var(--gold)}
select.inline{width:auto;padding:3px 7px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.grid2{grid-template-columns:1fr 1fr}}
.full{grid-column:1/-1}
details.adder{margin-top:12px;border:1px solid var(--line);border-radius:3px;background:var(--panel-2)}
details.adder>summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:500;list-style:none}
details.adder>summary::-webkit-details-marker{display:none}
details.adder>summary::before{content:"+ ";color:var(--gold);font-family:"IBM Plex Mono",monospace}
details.adder[open]>summary{border-bottom:1px solid var(--line)}
details.adder .body{padding:14px}
.note{font-size:12.5px;color:var(--ink-soft);border-left:2px solid var(--line-2);padding-left:11px;margin-top:14px}
.howto{margin-top:20px;background:var(--night-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.howto ol{margin:9px 0 0;padding-left:19px;display:flex;flex-direction:column;gap:6px}
.howto li{font-size:13px;color:var(--ink-soft)}
.howto li b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script id="app-js">

    {id:"customer-researcher",no:"02",place:"KLANTHUIS",x:78,y:176,col:"#F0A860",live:true,kind:"house",

  }
  function statusLabel(s){return s==="idle"?"Idle":SHINT[s];}

  /* ---------- pixel map ---------- */
  function rnd(seed){var s=seed;return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}

    path(0,112,W,12);          /* horizontal spine */
    path(194,0,12,H);          /* vertical spine */

    path(72,120,12,60);        /* to klanthuis */

    path(316,120,12,60);       /* to contentwerk */

    /* pond */
    px(150,150,34,20,"#17384F");px(152,152,30,16,"#1E4A66");px(154,154,26,12,"#25597A");

    for(var i=0;i<150;i++){

      var onBld=false;
      var all=AGENTS.concat([HQ]);
      for(var k=0;k<all.length;k++){var a=all[k];
        if(tx>a.x-34&&tx<a.x+34&&ty>a.y-30&&ty<a.y+26)onBld=true;}

    /* ---- building kit ---- */
    var WALL_D="#2A2740",WALL="#3A3556",WALL_L="#474169",WALL_S="#2E2A46",WIN_ON="#F4CE76",WIN_OFF="#221F36";

    function hq(){

      px(cx-1,ty-21,2,10,"#6A6488");
      px(cx-4,ty-24,9,3,HQ.col);
      g.fillStyle="rgba(245,197,66,.12)";g.beginPath();g.arc(cx,ty-22,16,0,6.3);g.fill();
      door(cx,base,true);
    }

    for(var m=0;m<AGENTS.length;m++){
      var a2=AGENTS[m];
      place(a2,a2.live);
      lamp(a2.x-33,a2.y+18,a2.live);lamp(a2.x+33,a2.y+18,a2.live);
    }
    hq();
    lamp(HQ.x-42,HQ.y+20,true);lamp(HQ.x+42,HQ.y+20,true);
    lamp(200,58,true);lamp(200,188,true);lamp(120,118,true);lamp(280,118,true);
    /* fountain */
    px(194,150,12,8,"#3C3856");px(196,151,8,6,"#2A5C7C");px(199,147,2,5,"#5FA0C4");
    px(198,146,4,1,"#7FC0E0");
    /* vignette */
    var grd=g.createRadialGradient(W/2,H/2,60,W/2,H/2,250);
    grd.addColorStop(0,"rgba(0,0,0,0)");grd.addColorStop(1,"rgba(0,0,0,.45)");
    g.fillStyle=grd;g.fillRect(0,0,W,H);
  }

  /* ---------- state io ---------- */
  function buildDoc(st){
    var css=document.getElementById("app-css").textContent;
    var js=document.getElementById("app-js").textContent;
    var json=JSON.stringify(st).replace(/</g,"\\u003c");
    var T="scr"+"ipt";
    return '<!doctype html><html lang="nl"><head><meta charset="utf-8">'
      +'<meta name="viewport" content="width=device-width, initial-scale=1"><title>Validatiedesk</title>'
      +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">'
      +'<style id="app-css">'+css+'</style></head><body>'
      +'<div class="wrap"><div id="app"></div></div>'
      +'<'+T+' id="state" type="application/json">'+json+'</'+T+'>'
      +'<'+T+' id="app-js">'+js+'</'+T+'></body></html>';
  }
  function pill(t,tone){var e=document.getElementById("savepill");if(!e)return;
    e.textContent=t;if(tone)e.setAttribute("data-tone",tone);else e.removeAttribute("data-tone");}
  function persist(){
    if(!api){pill("Alleen-lezen — niet bewaard","warn");return;}
    pill("Opslaan…");
    api.publish(buildDoc(state)).then(function(){
      pill("Opgeslagen","ok");setTimeout(function(){pill("Bewaard op deze pagina");},2200);
    }).catch(function(err){
      var c=err&&err.code;
      if(c==="conflict")pill("Iemand was eerder — pagina herlaadt","warn");
      else if(c==="not_granted"||c==="not_writer"){api=null;pill("Alleen-lezen — niet bewaard","warn");}
      else pill("Opslaan mislukt","warn");
    });
  }
  function commit(){render();persist();}

  /* ---------- render ---------- */
  function tags(){
    var h="";
    var all=AGENTS.map(function(a){return a;});
    all.forEach(function(a){
      var st=agentStatus(a.id);
      var col=a.live?SCOL[st]:"var(--idle)";
      var loff=a.kind==="tower"?52:(a.kind==="hall"?34:32);
      h+='<button class="tag" data-pick="'+a.id+'" data-sel="'+(state.sel===a.id?1:0)+'"'
        +' style="left:'+(a.x/W*100).toFixed(2)+'%;top:'+((a.y-loff)/H*100).toFixed(2)+'%;border-left-color:'+a.col+'">'
        +'<span class="no">'+a.no+'</span><span class="nm">'+esc(a.place)+'</span>'
        +'<span class="st"><i class="dot" style="background:'+col+'"></i>'
        +esc(a.live?statusLabel(st):"Buiten fase")+'</span></button>';
    });
    h+='<div class="tag" style="left:'+(HQ.x/W*100).toFixed(2)+'%;top:'+((HQ.y-60)/H*100).toFixed(2)
      +'%;border-left-color:'+HQ.col+';cursor:default">'
      +'<span class="no">00</span><span class="nm">HOOFDKWARTIER</span>'
      +'<span class="st"><i class="dot" style="background:var(--wait)"></i>Fase 1 · Valideren</span></div>';
    return h;
  }

  function briefCard(b){
    var h='<article class="brief"><h3>'+esc(b.topic)+'</h3>'
      +'<div class="meta"><div><b>Geografie</b>'+esc(b.geo||"—")+'</div>'
      +'<div><b>Beslissing die dit dient</b>'+esc(b.decision||"—")+'</div></div>';
    if(b.findings&&b.findings.length){
      h+='<div class="findings">';
      b.findings.forEach(function(f){
        h+='<div class="finding"><span class="chip" data-c="'+esc(f.confidence)+'">'+esc(f.confidence)+'</span>'
          +'<div><p>'+esc(f.text)+'</p><div class="src">'+esc(f.sources||"geen bron genoteerd")+'</div></div></div>';
      });
      h+='</div>';
    }
    h+='<div class="tools"><span class="chip" data-s="'+esc(b.status)+'">'+esc(b.status)+' · '+esc(SHINT[b.status])+'</span>'
      +'<select class="inline" data-status="'+b.id+'">';
    STATUSES.forEach(function(s){h+='<option value="'+s+'"'+(s===b.status?" selected":"")+'>'+s+'</option>';});
    h+='</select><button class="quiet" data-addf="'+b.id+'">+ bevinding</button>'
      +'<button class="quiet" data-del="'+b.id+'">verwijderen</button></div></article>';
    return h;
  }

  function agentPanel(){
    var a=agent(state.sel),bs=briefsOf(a.id),st=agentStatus(a.id);
    var h='<section class="panel"><h2>'+esc(a.no+" "+a.place)+'</h2><div class="body">'
      +'<div class="ahead"><div class="badge" style="background:'+a.col+'">'+esc(a.no)+'</div>'
      +'<div><div class="nm">'+esc(a.id)+'</div><div class="rl">'+esc(a.role)+'</div>'
      +'<div class="tools" style="margin-top:8px"><span class="chip" data-s="'
      +(a.live?(st==="idle"?"geparkeerd":st):"geparkeerd")+'">'
      +esc(a.live?statusLabel(st):"buiten fase")+'</span></div></div></div>';
    if(!a.live){
      h+='<div class="empty"><b>Deze agent staat stil.</b> Hij hoort bij een latere fase. '
        +'Eerst marktonderzoek, daarna beslissen we wat er nodig is.</div>';
    } else if(!bs.length){
      h+='<div class="empty"><b>Nog geen opdracht.</b> Een onderzoek start pas als onderwerp, '
        +'geografie en de te nemen beslissing vaststaan. Zet ze hieronder neer.</div>';
    } else {
      h+='<div class="stack">';bs.forEach(function(b){h+=briefCard(b);});h+='</div>';
    }
    if(a.live){
      h+='<details class="adder"><summary>Opdracht voor '+esc(a.place.toLowerCase())+'</summary><div class="body">'
        +'<div class="grid2">'
        +'<div class="full"><label for="f-topic">Onderwerp of probleemgebied</label>'
        +'<input id="f-topic" placeholder="Boekhoudsoftware voor zzp&#39;ers in de bouw"></div>'
        +'<div><label for="f-geo">Geografie</label><input id="f-geo" placeholder="Nederland"></div>'
        +'<div><label for="f-dec">Welke beslissing dient dit?</label><input id="f-dec" placeholder="Stap ik hier in?"></div>'
        +'<div class="full"><button class="primary" id="f-add">Toevoegen</button></div>'
        +'</div></div></details>';
    }
    return h+'</div></section>';
  }

  function decisionsPanel(){
    var open=state.decisions.filter(function(d){return !d.resolved;});
    var done=state.decisions.filter(function(d){return d.resolved;});
    var h='<section class="panel"><h2>NU AAN JOU</h2><div class="body">';
    if(!open.length){h+='<div class="empty"><b>Geen openstaande beslissingen.</b> Alles ligt bij Claude of is klaar.</div>';}
    else{
      h+='<div class="stack">';
      open.forEach(function(d){
        h+='<div class="dec"><h3>'+esc(d.question)+'</h3><p>'+esc(d.context)+'</p>'
          +'<div class="tools"><input data-ans="'+d.id+'" placeholder="Jouw besluit" style="flex:1;min-width:170px">'
          +'<button class="primary" data-resolve="'+d.id+'">Vastleggen</button></div></div>';
      });
      h+='</div>';
    }
    if(done.length){
      h+='<details style="margin-top:12px"><summary class="hint" style="cursor:pointer">'+done.length+' besloten</summary>'
        +'<div class="stack" style="margin-top:9px">';
      done.forEach(function(d){h+='<div class="brief"><div class="meta"><div><b>'+esc(d.question)+'</b>'
        +esc(d.answer||"—")+'</div></div></div>';});
      h+='</div></details>';
    }
    h+='<div class="howto"><b class="pix" style="font-size:9px">HOE DIT WERKT</b>'
      +'<ol><li>Jij zet een <b>opdracht</b> bij een gebouw neer, of legt een besluit vast.</li>'
      +'<li>Je zegt tegen Claude: <b>lees de validatiedesk</b>.</li>'
      +'<li>Claude leest deze pagina, draait de agent en zet de bevindingen erin terug.</li>'
      +'<li>Het rapport landt in <b>/drafts</b>, hier staat de samenvatting.</li></ol>'
      +'<p class="note">De kaart is een statusbord, geen live verbinding. De agents draaien in '
      +'Claude Code; de lampjes gaan aan als jij of Claude een status bijwerkt.</p></div>';
    return h+'</div></section>';
  }

  function render(){
    app.innerHTML=
      '<div class="hdr"><div><h1 class="pix">VALIDATIEDESK</h1>'
      +'<p class="sub">Fase 1 van drie. Elk gebouw is een agent: klik erop om zijn opdrachten te zien, '
      +'nieuwe opdrachten neer te zetten en bevindingen terug te lezen.</p></div>'
      +'<span class="savepill" id="savepill">'+(ready?(api?"Bewaard op deze pagina":"Alleen-lezen — niet bewaard"):"Verbinden…")+'</span></div>'
      +'<div class="mapbox"><div style="position:relative"><canvas id="map" width="'+(W*S)+'" height="'+(H*S)+'"></canvas>'
      +tags()+'</div>'
      +'<div class="maplegend"><span><i style="background:var(--idle)"></i>idle</span>'
      +'<span><i style="background:var(--wait)"></i>wacht op Claude</span>'
      +'<span><i style="background:var(--busy)"></i>Claude is bezig</span>'
      +'<span><i style="background:var(--ok)"></i>geleverd in /drafts</span></div></div>'
      +'<div class="cols">'+agentPanel()+decisionsPanel()+'</div>';
    draw();bind();
    if(ready&&!api)pill("Alleen-lezen — niet bewaard","warn");
  }

  function bind(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"),function(b){
      b.onclick=function(){state.sel=b.getAttribute("data-pick");render();persist();};
    });
    var add=document.getElementById("f-add");
    if(add)add.onclick=function(){
      var t=document.getElementById("f-topic").value.trim();
      if(!t){document.getElementById("f-topic").focus();return;}
      state.briefs.unshift({id:uid(),agent:state.sel,topic:t,
        geo:document.getElementById("f-geo").value.trim(),
        decision:document.getElementById("f-dec").value.trim(),status:"nieuw",findings:[]});
      commit();
    };
    Array.prototype.forEach.call(document.querySelectorAll("[data-status]"),function(sel){
      sel.onchange=function(){
        var b=state.briefs.filter(function(x){return x.id===sel.getAttribute("data-status");})[0];
        if(b){b.status=sel.value;commit();}
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"),function(btn){
      btn.onclick=function(){var id=btn.getAttribute("data-del");
        state.briefs=state.briefs.filter(function(x){return x.id!==id;});commit();};
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-addf]"),function(btn){
      btn.onclick=function(){
        var b=state.briefs.filter(function(x){return x.id===btn.getAttribute("data-addf");})[0];
        if(!b)return;
        var txt=window.prompt("Bevinding (een zin, feitelijk):");if(!txt)return;
        var conf=(window.prompt("Zekerheid: hoog, midden of laag?","midden")||"midden").toLowerCase();
        if(["hoog","midden","laag"].indexOf(conf)<0)conf="midden";
        var src=window.prompt("Bron (URL of korte aanduiding):")||"";
        b.findings.push({id:uid(),text:txt,confidence:conf,sources:src});commit();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-resolve]"),function(btn){
      btn.onclick=function(){
        var id=btn.getAttribute("data-resolve");
        var inp=document.querySelector('[data-ans="'+id+'"]');
        var v=inp?inp.value.trim():"";
        if(!v){if(inp)inp.focus();return;}
        var d=state.decisions.filter(function(x){return x.id===id;})[0];
        if(d){d.resolved=true;d.answer=v;commit();}
      };
    });
  }

  render();
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("artifact").then(function(a){api=a;ready=true;render();
      pill(api?"Bewaard op deze pagina":"Alleen-lezen — niet bewaard",api?null:"warn");
    }).catch(function(){ready=true;render();});
  } else {ready=true;render();}
})();
</script>

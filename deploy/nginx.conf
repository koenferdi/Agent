# AI-dossier — nginx-serverblok
#
# Plaats dit bestand als /etc/nginx/sites-available/jouwdomein.nl.conf en zet er
# een symlink naar in sites-enabled. De handleiding in HOSTEN.md loopt dat na.
#
# Dit blok luistert op poort 80. Certbot schrijft er zelf het https-gedeelte bij
# zodra je een certificaat aanvraagt; je hoeft dat niet met de hand te doen.

server {
    listen 80;
    listen [::]:80;

    server_name jouwdomein.nl www.jouwdomein.nl;
    root /var/www/jouwdomein.nl;

    index index.html;
    charset utf-8;
    autoindex off;

    # De site is volledig statisch: bestaat het bestand niet, dan 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # index.html mag niet blijven hangen in caches, anders zien bezoekers na een
    # update nog de oude tekst — en juridische teksten wil je vers hebben.
    location = / {
        expires -1;
    }
    location = /index.html {
        expires -1;
    }

    # styles.css en app.js hebben geen versienummer in hun naam. Een uur cache is
    # genoeg voor de snelheid en kort genoeg om niemand op oude code te laten zitten.
    location ~* \.(css|js)$ {
        expires 1h;
    }

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/xml application/ld+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Een Content-Security-Policy staat hier bewust uit. Zodra je LEAD_ENDPOINT
    # invult moet die host in connect-src staan, anders werkt de verzendknop niet.
    # Zie HOSTEN.md, hoofdstuk "Strenger afsluiten".

    access_log /var/log/nginx/jouwdomein.nl.access.log;
    error_log  /var/log/nginx/jouwdomein.nl.error.log;
}
